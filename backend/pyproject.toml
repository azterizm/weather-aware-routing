[project]
name = "weather-aware-routing-backend"
version = "1.0.0"
description = "Django REST API for weather-aware truck routing"
requires-python = ">=3.13,<3.14"
dependencies = [
    "brotli>=1.2.1",
    "django>=5.2,<5.3",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "polyline>=2.0.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "responses>=0.26.3",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ", "RUF"]
# Django/DRF declare configuration as mutable class attributes by design.
ignore = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
addopts = "-q"
